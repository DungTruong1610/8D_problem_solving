services:
  - type: web
    name: 8d-hackathon-backend
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    # ── Build ──
    # `npm run build` = bundle:library → cds build --production → compile:srv.
    # KHÔNG được bỏ `compile:srv`: CAP không đọc được TypeScript, nên nếu srv/
    # còn nguyên .ts thì `server.ts` bị bỏ qua TRONG IM LẶNG — app khởi động,
    # entity phục vụ bình thường, nhưng không handler nào chạy và không seed gì.
    # `--include=dev` vì NODE_ENV=production (đặt bên dưới) khiến npm bỏ qua
    # devDependencies — mà @sap/cds-dk và typescript là devDependency.
    #
    # `cds deploy` chạy SAU build và ghi thẳng vào artifact (gen/srv/db.sqlite)
    # vì `cds build` dựng lại gen/srv từ đầu. File này mang schema + dữ liệu
    # catalogue (Defects, InspectionLots…) và 0 case; kho case được nạp lúc
    # runtime từ `srv/data/case-library/` — xem seedLibraryFromBundle.
    buildCommand: npm install --include=dev && npm run build && npx cds deploy --to sqlite:gen/srv/db.sqlite
    # ── Start ──
    # Chạy từ GEN/SRV, không phải thư mục gốc: đó là artifact đã build
    # (server.js đã biên dịch + csn.json + data/case-library). Chạy ở gốc thì CAP
    # chỉ thấy srv/server.ts — file nó không đọc được — và bỏ qua toàn bộ bootstrap.
    # `../../node_modules/...` vì @sap/cds là dependency thật (devDeps đã bị bỏ).
    startCommand: cd gen/srv && node ../../node_modules/@sap/cds/bin/serve.js --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: CDS_CONFIG
        value: '{"requires":{"db":{"kind":"sqlite","credentials":{"url":"db.sqlite"}},"auth":{"kind":"mocked"}}}'

      # ── Chat: DeepSeek chính hãng (Platform API) ──
      # DEEPSEEK_API_KEY điền tay trong Render Dashboard (sync: false) để bảo mật tuyệt đối, không lộ ra git/frontend.
      # Cổng mặc định: DeepSeek chính hãng (https://api.deepseek.com) + model deepseek-flash
      # Nếu muốn đổi sang OpenCode Go: DEEPSEEK_BASE_URL=https://opencode.ai/zen/go/v1 và DEEPSEEK_MODEL=deepseek-v4.1-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash

      # ── Model mặc định cho từng loại bước (đọc trong srv/src/config/ai.ts) ──
      # DeepSeek chính hãng dùng model deepseek-flash cho các bước D1-D8, fallback dùng deepseek-v4-pro
      - key: AICORE_DEFAULT_MODEL
        value: deepseek-flash
      - key: AICORE_MODEL_PARSE
        value: deepseek-flash
      - key: AICORE_MODEL_STRUCTURE
        value: deepseek-flash
      - key: AICORE_MODEL_ANALYZE
        value: deepseek-flash
      # Lượt leo thang khi bước viết báo cáo trả JSON thiếu trường — model mạnh hơn.
      - key: AICORE_MODEL_ANALYZE_FALLBACK
        value: deepseek-v4-pro

      # ── Embedding: DeepSeek không có API embedding ──
      # Jina AI free tier, endpoint chuẩn OpenAI. Thiếu key này thì tiêu chí
      # "Similar description" cho 0 điểm cho mọi case (không lỗi, chỉ im lặng).
      - key: JINA_API_KEY
        sync: false
